# YAS's CI on Forge (xmit-dev/ultimator docs/CI.md), ported from .github/workflows/ci.yml, which runs on GitHub until
# Forge's phase P4. Linux jobs run in sandboxes, with Nix from ./.ultimator/actions/nix; packages also on arm64-ci
# (Linux arm64) and crab (macOS arm64); Windows x86_64 on crab-win under emulation (./.ultimator/actions/windows-x64).
# GitHub's reusable _build-packages.yml and _build-windows.yml are composite actions here (Forge has no reusable
# workflows). The coverage summary goes to the job's summary; there is no sticky pull request comment.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  nix-syntax:
    name: Nix syntax
    runs-on: sandbox
    timeout-minutes: 15
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - name: Parse all Nix files
        run: find . -name '*.nix' -exec nix-instantiate --parse {} + > /dev/null

  lint:
    name: Lint
    runs-on: sandbox
    timeout-minutes: 60
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - run: ./bin/lint --check
      - name: Check crates.io publication plan
        run: ./bin/publish-crates --plan

  # Publishing builds nothing (--no-verify), so build every crate from its package here, as crates.io users will.
  package-crates:
    name: Package crates
    runs-on: sandbox
    timeout-minutes: 90
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - run: ./bin/package-crates

  test:
    name: Tests
    runs-on: sandbox
    timeout-minutes: 90
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - run: ./bin/tests

  protocol-fuzz:
    name: Protocol fuzz
    runs-on: sandbox
    timeout-minutes: 60
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - name: Fuzz every YAS wire surface
        run: ./bin/fuzz
        env:
          YAS_FUZZ_SECONDS: "60"

  e2e:
    name: E2E
    runs-on: sandbox
    timeout-minutes: 90
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - run: ./bin/e2e
      - uses: upload-artifact
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: sandbox
    timeout-minutes: 90
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - name: Run tests with coverage
        run: ./bin/coverage
      - name: Write coverage summary
        run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: upload-artifact
        if: always()
        with:
          name: coverage-report
          path: coverage-report/html/
          retention-days: 30

  build-packages:
    name: Packages (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: sandbox
            label: linux-x86_64
          - runner: arm64-ci
            label: linux-aarch64
          - runner: crab
            label: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/packages
        with:
          label: ${{ matrix.label }}

  build-windows:
    name: Windows (x86_64, emulated)
    runs-on: crab-win
    timeout-minutes: 150
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: checkout
      - uses: cache
        with:
          path: target
          key: yas-windows-x86_64-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            yas-windows-x86_64-${{ hashFiles('Cargo.lock') }}-
      - uses: ./.ultimator/actions/windows-x64
