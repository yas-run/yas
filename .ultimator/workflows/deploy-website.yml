# The website (yas.run) on Fly, ported from .github/workflows/deploy-website.yml, which runs on GitHub until Forge's
# phase P4. It takes the sealed secret FLY_API_TOKEN (for yas-run/yas on main): pushes to main are trusted runs once
# main is protected.
name: deploy-website
on:
  push:
    branches: [main]
    paths:
      - "crates/website/**"
      - "crates/browser/**"
      - "js/web/**"
      - "js/core/**"
      - "js/solid/**"
      - "js/ui/**"
      - "install.sh"
      - "install.ps1"
      - "SKILL.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "js/pnpm-lock.yaml"
      - "js/pnpm-workspace.yaml"
      - ".dockerignore"
      - ".ultimator/workflows/deploy-website.yml"
concurrency:
  group: deploy-website
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy
    runs-on: sandbox
    timeout-minutes: 60
    steps:
      - uses: checkout
      - uses: ./.ultimator/actions/nix
      - run: nix run .#deploy-website
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
